services:
  postgres:
    image: postgres:16-alpine
    container_name: casecell_postgres
    environment:
      POSTGRES_USER: casecell_user
      POSTGRES_PASSWORD: casecell_password
      POSTGRES_DB: casecell_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casecell_user -d casecell_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: casecell_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casecell_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: casecell_user
      DB_PASSWORD: casecell_password
      DB_NAME: casecell_db
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casecell_frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001
      NUXT_API_BASE: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
